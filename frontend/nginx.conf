# nginx inside the frontend container.
#
# It does two jobs: serve the built React app, and forward API calls to the backend
# container. Forwarding means the browser only ever talks to this one address, so - just
# as with the Vite proxy in development - the backend needs no CORS configuration.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # "backend" is the service name in docker-compose.yml; Docker's own DNS resolves it
    # to the backend container on the network the two share.
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # A resume upload can be up to 5 MB plus the form around it - the same limits as
        # spring.servlet.multipart in application.yml. nginx's own default is 1 MB.
        client_max_body_size 6m;

        # The assistant can take a while when it calls several tools in one answer.
        proxy_read_timeout 120s;
    }

    location /actuator/ {
        proxy_pass http://backend:8081;
    }

    # Everything else belongs to React Router. An address like /drives/12/edit has no
    # file on disk, so nginx serves index.html and the app works out the page itself.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
