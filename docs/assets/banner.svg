<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Placement Prep</title>
  <desc id="desc">Campus placements, organised - for students, recruiters and the placement cell.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338ca"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tileIndigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="tileGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="tileAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="380" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <circle cx="1080" cy="40" r="260" fill="url(#glow)"/>
    <circle cx="120" cy="420" r="240" fill="url(#glow)"/>
    <circle cx="640" cy="-60" r="160" fill="url(#glow)"/>

    <!-- Logo, title and tagline -->
    <rect x="64" y="58" width="68" height="68" rx="18" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.35"/>
    <g transform="translate(78 72) scale(1.67)" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.26 10.15a60 60 0 0 0-.49 6.35A48.6 48.6 0 0 1 12 20.9a48.6 48.6 0 0 1 8.23-4.4 60 60 0 0 0-.49-6.35m-15.48 0a50.6 50.6 0 0 0-2.66-.81A59.9 59.9 0 0 1 12 3.5a59.9 59.9 0 0 1 10.4 5.84c-.9.25-1.78.52-2.66.81m-15.48 0A50.7 50.7 0 0 1 12 13.49a50.7 50.7 0 0 1 7.74-3.34M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.68A55.4 55.4 0 0 1 12 8.44"/>
    </g>
    <text x="64" y="200" fill="#ffffff" font-family="'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5">Placement Prep</text>
    <text x="66" y="244" fill="#ffffff" fill-opacity="0.9" font-family="'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22">Campus placements, organised - for students,</text>
    <text x="66" y="274" fill="#ffffff" fill-opacity="0.9" font-family="'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="22">recruiters and the training &amp; placement cell.</text>

    <!-- Stack chips -->
    <g font-family="'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">
      <rect x="64" y="300" width="148" height="32" rx="16" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="138" y="321" text-anchor="middle">Spring Boot 4</text>
      <rect x="222" y="300" width="98" height="32" rx="16" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="271" y="321" text-anchor="middle">React 19</text>
      <rect x="330" y="300" width="182" height="32" rx="16" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="421" y="321" text-anchor="middle">PostgreSQL + pgvector</text>
      <rect x="522" y="300" width="96" height="32" rx="16" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.3"/>
      <text x="570" y="321" text-anchor="middle">Spring AI</text>
    </g>

    <!-- Floating cards, echoing real screens -->
    <g font-family="'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif">
      <!-- Notification -->
      <g transform="translate(760 58)" filter="url(#shadow)">
        <rect width="372" height="82" rx="18" fill="#ffffff"/>
        <rect x="16" y="20" width="42" height="42" rx="12" fill="url(#tileGreen)"/>
        <path d="M28 41.5l6 6 10-14" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="72" y="38" fill="#0f172a" font-size="15" font-weight="700">You have been shortlisted</text>
        <text x="72" y="60" fill="#64748b" font-size="13">Quanta Labs - Data Engineer</text>
        <circle cx="350" cy="28" r="5" fill="#8b5cf6"/>
      </g>
      <!-- Drive card -->
      <g transform="translate(700 156)" filter="url(#shadow)">
        <rect width="372" height="92" rx="18" fill="#ffffff"/>
        <rect x="16" y="22" width="46" height="46" rx="13" fill="url(#tileIndigo)"/>
        <text x="39" y="52" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">N</text>
        <text x="76" y="42" fill="#0f172a" font-size="16" font-weight="700">Nimbus Systems</text>
        <text x="76" y="64" fill="#64748b" font-size="13">Software Engineer</text>
        <text x="352" y="42" text-anchor="end" fill="#059669" font-size="16" font-weight="800">&#8377;18.5 LPA</text>
        <rect x="262" y="52" width="92" height="22" rx="11" fill="#fff1f2"/>
        <text x="308" y="67" text-anchor="middle" fill="#e11d48" font-size="11.5" font-weight="600">Closes in 2 days</text>
      </g>
      <!-- Semantic search match -->
      <g transform="translate(790 264)" filter="url(#shadow)">
        <rect width="342" height="78" rx="18" fill="#ffffff"/>
        <rect x="16" y="18" width="42" height="42" rx="12" fill="url(#tileAmber)"/>
        <circle cx="35" cy="37" r="7.5" fill="none" stroke="#ffffff" stroke-width="2.4"/>
        <path d="M40.5 42.5l6 6" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
        <text x="72" y="36" fill="#0f172a" font-size="14.5" font-weight="700">"data pipelines with Spark"</text>
        <text x="72" y="58" fill="#64748b" font-size="13">Matched by meaning</text>
        <rect x="246" y="45" width="80" height="22" rx="11" fill="#d1fae5"/>
        <text x="286" y="60" text-anchor="middle" fill="#047857" font-size="11.5" font-weight="700">59% match</text>
      </g>
    </g>
  </g>
</svg>
