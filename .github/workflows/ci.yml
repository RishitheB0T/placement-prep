name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # The local embedding model behind job-description search, and the PyTorch
      # library it runs on, download on first use - about 350 MB together. Every CI run
      # starts on a fresh machine, so without this they would download on every run. The
      # key names the pinned model revision (application.yml) and the DJL version, so a
      # change to either fetches the new files once instead of reusing stale ones.
      - name: Cache embedding model and PyTorch library
        uses: actions/cache@v4
        with:
          path: |
            ~/.placementprep/models
            ~/.djl.ai
          key: embedding-${{ runner.os }}-all-MiniLM-L6-v2-1110a243-djl-0.36.0

      # `verify` compiles, runs the tests, and packages the jar. The context test
      # starts a real PostgreSQL container, which works because GitHub's Ubuntu
      # runners have Docker available out of the box.
      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs exactly what package-lock.json pins, unlike `npm install`
      # which may resolve newer versions.
      - name: Install dependencies
        run: npm ci

      # Before the build, so a failing test stops the job at the cheaper step. Vitest
      # needs no backend and no Docker - every call through src/api is stubbed - so this
      # runs in a couple of seconds and cannot fail for reasons outside the frontend.
      - name: Test
        run: npm test

      # `npm run build` type-checks with `tsc -b` before bundling, so this also catches
      # type errors that the tests alone would not.
      - name: Build
        run: npm run build
