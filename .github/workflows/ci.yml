name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # `verify` compiles, runs the tests, and packages the jar. The context test
      # starts a real PostgreSQL container, which works because GitHub's Ubuntu
      # runners have Docker available out of the box.
      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs exactly what package-lock.json pins, unlike `npm install`
      # which may resolve newer versions.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
