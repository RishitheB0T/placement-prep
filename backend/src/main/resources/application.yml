server:
  # Port 8080 is taken on this machine by an unrelated Windows service, so the
  # local default is 8081. Override with SERVER_PORT anywhere 8080 is free.
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: placementprep

  # Connection details come from environment variables so the same build runs
  # locally, in CI, and in production. The defaults match docker-compose.yml.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/placementprep}
    username: ${DB_USERNAME:placementprep}
    password: ${DB_PASSWORD:placementprep}

  jpa:
    hibernate:
      # Hibernate never creates or alters tables. Flyway owns the schema.
      ddl-auto: validate
    # Close the database session when the controller returns, not when the
    # response is rendered. Avoids accidental lazy-loading queries in the view.
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
