server:
  # Port 8080 is taken on this machine by an unrelated Windows service, so the
  # local default below uses a different one. Override with SERVER_PORT anywhere
  # 8080 is free.
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: placementprep

  mvc:
    # Render errors as RFC 9457 Problem Details, the same shape the security handlers
    # already produce, so every error from this API looks alike.
    problemdetails:
      enabled: true

  # Every request runs on a Java 21 virtual thread rather than one of Tomcat's 200 pooled
  # threads. A request that is waiting - on the database, or for half a minute on the
  # model - parks its virtual thread, which costs next to nothing, so a burst of assistant
  # chats can no longer use up the pool and leave every other request queueing.
  threads:
    virtual:
      enabled: true

  # Scheduled jobs share one thread by default. One each instead - the resume review, the
  # deadline reminders and the orphaned-file sweep - so a slow review (a model call can
  # take half a minute, and a run drains the whole queue) never holds up the others.
  # PlacementprepApplication.taskScheduler explains why this pool is declared by hand.
  task:
    scheduling:
      pool:
        size: 3

  web:
    error:
      # Spring Boot 4 moved this group from server.error.* to spring.web.error.*. The old
      # names are deprecated at level "error", meaning they are no longer bound at all
      # rather than merely discouraged, so the previous spelling silently did nothing.
      #
      # DevTools turns stack traces on in development. A stack trace names internal
      # classes and library versions, so it is never returned to a client.
      include-stacktrace: never
      include-message: always

  # Connection details come from environment variables so the same build runs
  # locally, in CI, and in production. The defaults match docker-compose.yml.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/placementprep}
    username: ${DB_USERNAME:placementprep}
    password: ${DB_PASSWORD:placementprep}

  jpa:
    hibernate:
      # Hibernate never creates or alters tables. Flyway owns the schema.
      ddl-auto: validate
    # Close the database session when the controller returns, not when the
    # response is rendered. Avoids accidental lazy-loading queries in the view.
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # A resume is a page or two of PDF. 5 MB is generous for that, and small enough
      # that nobody can fill the disk by uploading something enormous.
      max-file-size: 5MB
      # The file plus the driveId field that travels with it in the same form.
      max-request-size: 6MB

  ai:
    anthropic:
      # Unset by default, same convention as jwt.secret below: nothing real is
      # hard-coded. Without it, resume feedback still saves the upload but finishes the
      # review as FAILED with a message saying AI feedback is not switched on.
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        # Overridable without a rebuild, e.g. ANTHROPIC_MODEL=claude-sonnet-5-5.
        model: ${ANTHROPIC_MODEL:claude-opus-5-5}

    # The local embedding model behind job-description search. Downloaded once (about
    # 90 MB) on the first start and reused after that. Both URLs name one fixed revision
    # rather than a branch, so the model - and therefore every stored vector - cannot
    # change underneath the database between one start and the next.
    embedding:
      transformer:
        onnx:
          model-uri: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/1110a243fdf4706b3f48f1d95db1a4f5529b4d41/onnx/model.onnx
        tokenizer:
          uri: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/1110a243fdf4706b3f48f1d95db1a4f5529b4d41/tokenizer.json
        cache:
          # A folder of its own rather than the OS temp directory, which disk clean-up
          # tools empty - that would mean another 90 MB download on the next start.
          directory: ${EMBEDDING_CACHE_DIR:${user.home}/.placementprep/models}

    # A ceiling on how many tools the assistant may call while answering one message,
    # so a confused model cannot loop - and keep paying - indefinitely.
    tools:
      limits:
        max-total-tool-calls: 8

    vectorstore:
      pgvector:
        # Flyway owns the schema (V12 creates this table), same as every other table.
        initialize-schema: false
        table-name: job_description_chunks
        # all-MiniLM-L6-v2 turns any text into 384 numbers.
        dimensions: 384
        distance-type: cosine-distance
        index-type: hnsw

# Where uploaded resumes are kept, and how often the background review checks for new
# ones. The directory is relative to wherever the backend is started from - backend/
# when it is run with mvnw - and is listed in .gitignore.
resume:
  storage:
    directory: ${RESUME_STORAGE_DIR:uploads/resumes}
  review:
    # ISO-8601 duration: PT5S is five seconds.
    poll-delay: ${RESUME_REVIEW_POLL_DELAY:PT5S}
  # Stored PDFs whose resume row is gone (its drive was deleted) are removed this often.
  cleanup:
    initial-delay: PT10M
    poll-delay: PT6H

# Students' drive notifications: how soon after startup the first pass runs, and how
# long to wait after each pass before the next. A reminder is sent at most once per
# student, drive and kind, so running often only makes reminders more timely.
notification:
  reminders:
    initial-delay: ${NOTIFICATION_INITIAL_DELAY:PT1M}
    poll-delay: ${NOTIFICATION_POLL_DELAY:PT15M}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  # HMAC-SHA256 needs at least 32 bytes; a shorter value fails fast at startup.
  # The local default exists only so the project runs out of the box. Any real
  # deployment must set JWT_SECRET to something random and private.
  secret: ${JWT_SECRET:local-development-only-secret-change-me-in-production}
  # 24 hours, in milliseconds.
  expiration: ${JWT_EXPIRATION:86400000}
