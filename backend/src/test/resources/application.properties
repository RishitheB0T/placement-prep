# Test-only settings, loaded on top of src/main/resources/application.yml (a different
# file name, so both are read; on a clash these win).

# Tests store resumes under target/, never in the developer's real uploads folder.
resume.storage.directory=target/test-resumes

# The scheduled jobs that tests trigger themselves wait a day before their first automatic
# run, so a run can never land in the middle of a test and change what it sees. The orphan
# sweep in particular must never scan a folder against a test database.
resume.cleanup.initial-delay=PT24H
notification.reminders.initial-delay=PT24H
